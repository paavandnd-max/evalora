<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff login · Evalora</title>
<style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#223027;background:#f2f5f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #e1e6df;border-radius:14px;padding:30px;box-shadow:0 20px 55px #26392b16}.brand{font-size:21px;font-weight:750;margin-bottom:27px}.brand span{color:#63814b}.back{font-size:12px;color:#738078;text-decoration:none}.card h1{font-size:25px;margin:14px 0 7px}.card p{color:#748078;font-size:13px;line-height:1.5}.form{display:grid;gap:8px;margin-top:22px}.form label{font-weight:650;font-size:12px;margin-top:6px}.form input{width:100%;border:1px solid #d9e0d8;border-radius:8px;padding:12px;font:inherit;background:#fff;color:#223027;-webkit-text-fill-color:#223027;color-scheme:light}.form button{margin-top:11px;border:0;border-radius:8px;padding:12px;background:#304e3d;color:white;font:inherit;font-weight:650;cursor:pointer}.error{min-height:18px;color:#a94e44!important;font-size:12px!important}.note{border-top:1px solid #edf0eb;padding-top:14px;margin-top:20px;font-size:11px!important}</style></head>
<body><main class="card"><div class="brand">Eval<span>ora</span></div><a class="back" href="/">← Public home</a><h1>Staff sign in</h1><p>For authorized administrators, judges, and mentors. Participant repository submissions do not require an account.</p><form class="form" id="login"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="error" class="error" role="alert"></p><button id="submit" type="submit">Sign in</button></form><p class="note">Access to events and reports is checked by the server. Ask your event administrator for staff credentials.</p></main>
<script>const form=document.getElementById('login'),error=document.getElementById('error'),button=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;error.textContent='';try{const data=Object.fromEntries(new FormData(form));const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Sign in failed.');if(!['admin','judge','mentor'].includes(result.user?.role)){await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:'{}'});throw new Error('This page is for staff accounts only.')}location.assign('/dashboard')}catch(e){error.textContent=e.message}finally{button.disabled=false}});</script></body></html>
